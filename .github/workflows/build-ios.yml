name: Build whiteLIST iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test Go core
        run: go test ./...

      - name: Build OpenFlux library
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_ios.sh
          ./build_ios.sh
          test -s output/ios/liboflux.a
          grep -q OFStartYandex output/ios/liboflux.h
          grep -q OFStartMax output/ios/liboflux.h
          grep -q OFSendPacket output/ios/liboflux.h
          grep -q OFReceivePacket output/ios/liboflux.h
          grep -q OFStatusJSON output/ios/liboflux.h

      - name: Compile app and packet tunnel
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="$PWD/build/Payload/whiteLIST.app"
          EXT="$APP/PlugIns/OpenFluxTunnel.appex"

          rm -rf "$PWD/build"
          mkdir -p "$EXT"
          cp ios/Info.plist "$APP/Info.plist"
          cp ios/Tunnel-Info.plist "$EXT/Info.plist"

          xcrun --sdk iphoneos swiftc \
            -O -parse-as-library \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -module-name whiteLIST \
            ios/App.swift \
            -framework UIKit \
            -framework Foundation \
            -framework NetworkExtension \
            -o "$APP/whiteLIST"

          xcrun --sdk iphoneos swiftc \
            -O -parse-as-library -application-extension \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -module-name OpenFluxTunnel \
            -import-objc-header "$PWD/output/ios/liboflux.h" \
            ios/PacketTunnelProvider.swift \
            "$PWD/output/ios/liboflux.a" \
            -framework Foundation \
            -framework Network \
            -framework NetworkExtension \
            -framework Security \
            -Xlinker -e -Xlinker _NSExtensionMain \
            -Xlinker -no_warn_duplicate_libraries \
            -o "$EXT/OpenFluxTunnel"

          chmod +x "$APP/whiteLIST" "$EXT/OpenFluxTunnel"
          file "$APP/whiteLIST" "$EXT/OpenFluxTunnel"

      - name: Embed entitlements and package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$PWD/build/Payload/whiteLIST.app"
          EXT="$APP/PlugIns/OpenFluxTunnel.appex"

          codesign --force --sign - --entitlements ios/Tunnel.entitlements "$EXT"
          codesign --force --sign - --entitlements ios/App.entitlements "$APP"
          codesign --verify --deep --strict "$APP"

          codesign -d --entitlements :- "$EXT" 2>&1 | grep -q packet-tunnel-provider
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT/Info.plist" \
            | grep -q com.apple.networkextension.packet-tunnel

          cd build
          /usr/bin/zip -qry whiteLIST-unsigned.ipa Payload
          shasum -a 256 whiteLIST-unsigned.ipa | tee whiteLIST-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: whiteLIST-iOS
          path: |
            build/whiteLIST-unsigned.ipa
            build/whiteLIST-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
